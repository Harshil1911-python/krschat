services:
  - type: web
    name: khandhars-chat
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker --workers 1 --bind 0.0.0.0:$PORT --timeout 120 wsgi:app
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: khandhars-chat-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000

databases:
  - name: khandhars-chat-db
    databaseName: khandhars_chat
    user: khandhars
    plan: starter
    region: oregon
