<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Banned - Khandhars Chat</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;background:var(--bg);">
  <div class="animate-slideUp">
    <div style="font-size:4rem;margin-bottom:16px;">🚫</div>
    <h2 style="margin-bottom:8px;">Account Banned</h2>
    <p style="color:var(--text-3);margin-bottom:8px;">Your account has been suspended from Khandhars Chat.</p>
    {% if reason %}<p style="color:var(--danger);font-size:0.9rem;margin-bottom:16px;padding:10px;background:rgba(239,68,68,0.1);border-radius:8px;">Reason: {{ reason }}</p>{% endif %}
    <p style="color:var(--text-3);font-size:0.85rem;margin-bottom:28px;">If you believe this is a mistake, please contact support.</p>
    <a href="/auth/logout" class="btn btn-secondary">Sign Out</a>
  </div>
</div>
</body>
</html>
