<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>400 - Khandhars Chat</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;background:var(--bg);">
  <div class="animate-slideUp">
    <div style="font-size:5rem;font-family:var(--font-display);font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1;">400</div>
    <h2 style="margin:12px 0 8px;">Oops! Something went wrong</h2>
    <p style="color:var(--text-3);margin-bottom:28px;font-size:0.95rem;">We hit a snag. Try going back or returning home.</p>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <a href="/" class="btn btn-primary">Go Home</a>
      <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
    </div>
  </div>
</div>
</body>
</html>
